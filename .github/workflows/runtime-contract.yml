name: Runtime contract (official ORT)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-runtime-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            files=$(gh api --paginate --jq '.[].filename' "repos/$GITHUB_REPOSITORY/pulls/$PR/files")
            if printf '%s\n' "$files" | grep -Eq '^(.github/workflows/|scripts/(onnx_runtime_contract|spectral_core_graph|spectral_core_patch|export_spectral_core)\.py|tests/test_(runtime_contract_gate|spectral_core_graph|spectral_core_patch)\.py|requirements)'; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  contract:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/runtime-contract.yml

      - name: Install onnx + onnxruntime (no torch)
        run: |
          pip install "onnx>=1.14" "onnxruntime>=1.23,<2"

      - name: Domain gate self-test
        run: python scripts/onnx_runtime_contract.py --self-test

      - name: Behavior tests (contract + ensemble graph)
        run: python tests/test_runtime_contract_gate.py

      - name: Behavior tests (spectral-core graph gate + ensemble)
        run: python tests/test_spectral_core_graph.py

      - name: Behavior tests (spectral-core trace patch; skipped without torch)
        run: python tests/test_spectral_core_patch.py

      - name: Syntax check scripts
        run: python -m compileall -q scripts

  gate:
    if: always()
    needs: [changes, contract]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CONTRACT: ${{ needs.contract.result }}
          EXPECTED: ${{ needs.changes.outputs.run }}
        run: |
          test "$CHANGES" = success
          if [ "$EXPECTED" = true ]; then test "$CONTRACT" = success; else test "$CONTRACT" = skipped; fi
