name: Runtime contract (official ORT)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/runtime-contract.yml

      - name: Install onnx + onnxruntime (no torch)
        run: |
          pip install "onnx>=1.14" "onnxruntime>=1.23,<2"

      - name: Domain gate self-test
        run: python scripts/onnx_runtime_contract.py --self-test

      - name: Behavior tests (contract + ensemble graph)
        run: python tests/test_runtime_contract_gate.py

      - name: Behavior tests (spectral-core graph gate + ensemble)
        run: python tests/test_spectral_core_graph.py

      - name: Behavior tests (spectral-core trace patch; skipped without torch)
        run: python tests/test_spectral_core_patch.py

      - name: Syntax check scripts
        run: python -m compileall -q scripts
