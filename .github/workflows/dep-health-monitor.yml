name: Dependency automation health monitor

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC (same as dep-detection)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  health-check:
    permissions:
      issues: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_dep_automation_health.py --json > /tmp/health.json
          EXIT_CODE=$?
          set -e
          cat /tmp/health.json
          TITLE="deps: automation health alert (stale or failed)"
          # One canonical alert: reuse the oldest open issue with this exact title.
          EXISTING=$(gh issue list --state open --label dependencies --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | sort_by(.number) | .[0].number // empty")
          if [ $EXIT_CODE -ne 0 ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/health.json'))
          lines = ['## Dependency automation health alert', '']
          for k, v in d.items():
              lines.append(f'### {k}')
              lines.append('\`\`\`json')
              lines.append(json.dumps(v, indent=2))
              lines.append('\`\`\`')
              lines.append('')
          print('\n'.join(lines))
          " > /tmp/body.md
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file /tmp/body.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/body.md --label dependencies
            fi
            exit $EXIT_CODE
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --reason completed \
              --comment "Automation health check is healthy again (run ${GITHUB_RUN_ID}); closing the canonical alert."
          fi
      - name: Health check tests
        run: |
          pip install "pytest>=8.0"
          python -m pytest tests/test_dep_health.py -q
