name: Convert and Release

on:
  push:
    tags:
      - "model-spectral-v*"
      - "model-ft-spectral-v*"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to convert"
        type: choice
        options: [htdemucs, htdemucs_ft]
        default: htdemucs

permissions:
  contents: write

concurrency:
  group: convert-${{ github.ref }}-${{ github.event.inputs.model || 'auto' }}
  cancel-in-progress: true

jobs:
  detect-model:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      model: ${{ steps.model.outputs.model }}
      is_ensemble: ${{ steps.model.outputs.is_ensemble }}
      artifact: ${{ steps.model.outputs.artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Determine model from tag or input
        id: model
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODEL="${{ github.event.inputs.model }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == model-ft-spectral-* ]]; then
              MODEL="htdemucs_ft"
            else
              MODEL="htdemucs"
            fi
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          if [ "$MODEL" = "htdemucs_ft" ]; then
            echo "is_ensemble=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ensemble=false" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact=${MODEL}.spectral.onnx" >> "$GITHUB_OUTPUT"

  # Parallel sub-model export for htdemucs_ft (4 jobs, ~6min wall time
  # instead of ~20min serial).
  export-sub-models:
    needs: detect-model
    if: needs.detect-model.outputs.is_ensemble == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Demucs pretrained weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: demucs-weights-htdemucs_ft-${{ hashFiles('requirements.txt') }}

      - name: Export sub-model ${{ matrix.index }} (spectral-core)
        run: |
          python scripts/export_spectral_core.py \
            --model htdemucs_ft \
            --sub-model-index ${{ matrix.index }} \
            --output sub_${{ matrix.index }}.onnx

      - name: Upload sub-model artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sub-model-${{ matrix.index }}
          path: sub_${{ matrix.index }}.onnx
          retention-days: 7

  # Single-model path for htdemucs: export + optimize + validate + release
  # in one job (already fast, ~5min).
  convert-single:
    needs: detect-model
    if: needs.detect-model.outputs.is_ensemble == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT: ${{ needs.detect-model.outputs.artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Demucs pretrained weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: demucs-weights-htdemucs-${{ hashFiles('requirements.txt') }}

      - name: Export spectral-core model
        run: python scripts/export_spectral_core.py --model ${{ needs.detect-model.outputs.model }}

      - name: Record model size
        id: convert
        run: |
          SIZE_MB=$(stat -c%s "models/$ARTIFACT" | awk '{printf "%.1f", $1/1048576}')
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Validate spectral contract (torch reference)
        id: validate-spectral
        run: |
          python scripts/validate_spectral_contract.py "models/$ARTIFACT" \
            --torch-reference --model ${{ needs.detect-model.outputs.model }} 2>&1 | tee validate.log
          MSE=$(grep 'composed:' validate.log | head -1 | awk '{print $3}')
          echo "mse=$MSE" >> "$GITHUB_OUTPUT"

      - name: Runtime contract (protobuf + ORT CPU session)
        run: python scripts/onnx_runtime_contract.py --model "models/$ARTIFACT" --ort-session

      - name: Generate checksum
        run: |
          cd models
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "Checksum:"
          cat "$ARTIFACT.sha256"

      - name: Compose release notes
        run: |
          MODEL="${{ needs.detect-model.outputs.model }}"
          MSE="${{ steps.validate-spectral.outputs.mse }}"
          SIZE="${{ steps.convert.outputs.size_mb }}"
          cat > release-body.md <<EOF
          ## $MODEL spectral-core ONNX model

          Demucs neural-network core exported at the \`openkara.spectral-contract/v1\` boundary
          (see \`docs/spectral-core-contract.md\`): the waveform<->spectral transforms run in the
          application, so the graph carries no STFT/ISTFT nodes and no dense DFT filter-bank
          constants.

          **Model spec:**
          - Inputs: \`spectral [1,2,2,2048,336]\` (contract spec of the mix), \`mix [1,2,343980]\`
          - Outputs: \`spectral_out [1,4,2,2,2048,336]\` (pre-ISTFT, drums/bass/other/vocals), \`time_out [1,4,2,343980]\`
          - Composition: \`stems[s] = ispec(spectral_out[:,s], 343980) + time_out[:,s]\`
          - Format: ONNX opset 17, optimized by ONNX Runtime offline graph optimization

          **Build metrics:**
          - Model size: $SIZE MB
          - Composed-waveform validation MSE vs PyTorch: $MSE

          **Verification:** SHA-256 checksum included in \`$ARTIFACT.sha256\`.
          Validated stage-level and end-to-end against the PyTorch reference (MSE < 1e-4),
          spectral-core contract gate (interface, transform ops, DFT signatures, metadata) passed.
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.detect-model.outputs.model }}-spectral-core-onnx
          path: |
            models/${{ needs.detect-model.outputs.artifact }}
            models/${{ needs.detect-model.outputs.artifact }}.sha256
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            models/${{ needs.detect-model.outputs.artifact }}
            models/${{ needs.detect-model.outputs.artifact }}.sha256
          body_path: release-body.md
          generate_release_notes: true

  # Ensemble merge + finalize path for htdemucs_ft: merges 4 sub-model
  # artifacts, optimizes, validates, and releases.
  finalize-ensemble:
    needs: [detect-model, export-sub-models]
    if: needs.detect-model.outputs.is_ensemble == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT: ${{ needs.detect-model.outputs.artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Demucs pretrained weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface/hub
          key: demucs-weights-htdemucs_ft-${{ hashFiles('requirements.txt') }}

      - name: Download all sub-model artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sub-model-*
          path: sub-models
          merge-multiple: true

      - name: Merge + optimize + annotate (spectral-core)
        run: |
          python scripts/export_spectral_core.py \
            --model htdemucs_ft \
            --merge-from sub-models

      - name: Record model size
        id: convert
        run: |
          SIZE_MB=$(stat -c%s "models/$ARTIFACT" | awk '{printf "%.1f", $1/1048576}')
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Validate spectral contract (torch reference)
        id: validate-spectral
        run: |
          python scripts/validate_spectral_contract.py "models/$ARTIFACT" \
            --torch-reference --model htdemucs_ft 2>&1 | tee validate.log
          MSE=$(grep 'composed:' validate.log | head -1 | awk '{print $3}')
          echo "mse=$MSE" >> "$GITHUB_OUTPUT"

      - name: Runtime contract (protobuf + ORT CPU session)
        run: python scripts/onnx_runtime_contract.py --model "models/$ARTIFACT" --ort-session

      - name: Generate checksum
        run: |
          cd models
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "Checksum:"
          cat "$ARTIFACT.sha256"

      - name: Compose release notes
        run: |
          MSE="${{ steps.validate-spectral.outputs.mse }}"
          SIZE="${{ steps.convert.outputs.size_mb }}"
          cat > release-body.md <<EOF
          ## htdemucs_ft spectral-core ONNX model

          Demucs fine-tuned 4-model ensemble exported at the \`openkara.spectral-contract/v1\`
          boundary (see \`docs/spectral-core-contract.md\`) and averaged in the spectral domain
          (exactly equivalent to the waveform average by linearity of the ISTFT). The graph
          carries no STFT/ISTFT nodes and no dense DFT filter-bank constants.

          **Model spec:**
          - Inputs: \`spectral [1,2,2,2048,336]\` (contract spec of the mix), \`mix [1,2,343980]\`
          - Outputs: \`spectral_out [1,4,2,2,2048,336]\` (pre-ISTFT, drums/bass/other/vocals), \`time_out [1,4,2,343980]\`
          - Composition: \`stems[s] = ispec(spectral_out[:,s], 343980) + time_out[:,s]\`
          - Format: ONNX opset 17, optimized by ONNX Runtime offline graph optimization

          **Build metrics:**
          - Model size: $SIZE MB
          - Composed-waveform validation MSE vs PyTorch: $MSE

          **Verification:** SHA-256 checksum included in \`$ARTIFACT.sha256\`.
          Validated stage-level and end-to-end against the PyTorch ensemble reference (MSE < 1e-4),
          spectral-core contract gate (interface, transform ops, DFT signatures, metadata) passed.
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: htdemucs_ft-spectral-core-onnx
          path: |
            models/${{ needs.detect-model.outputs.artifact }}
            models/${{ needs.detect-model.outputs.artifact }}.sha256
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            models/${{ needs.detect-model.outputs.artifact }}
            models/${{ needs.detect-model.outputs.artifact }}.sha256
          body_path: release-body.md
          generate_release_notes: true
