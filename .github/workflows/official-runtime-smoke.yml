name: Official runtime smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-official-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            files=$(gh api --paginate --jq '.[].filename' "repos/$GITHUB_REPOSITORY/pulls/$PR/files")
            if printf '%s\n' "$files" | grep -Eq '^(.github/workflows/|ort/|scripts/(archive_utils|run_native_smoke|download_stable_model|generate_catalog_v2|repackage_nuget_runtime|nuget_package|build_runtime|ort_api_version)\.py|tests/test_nuget_repackage\.py|catalog/)'; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  repackage:
    name: Repackage NuGet runtimes
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Repackager tests
        run: |
          python -m pip install 'pytest>=8.0'
          python -m pytest tests/test_nuget_repackage.py -q
      - name: Verify the signed NuGet package and repackage every target
        run: |
          dotnet --version
          python scripts/repackage_nuget_runtime.py --output packages --headers headers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-nuget-runtimes
          path: |
            packages
            headers
          if-no-files-found: error
          retention-days: 30
  smoke:
    needs: [changes, repackage]
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            provider: cpu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            provider: cpu
          - runner: macos-latest
            target: aarch64-apple-darwin
            provider: cpu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            provider: cpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ort-nuget-runtimes
          path: nuget
      - name: Download stable model
        run: python scripts/download_stable_model.py --catalog catalog/releases/2026-07-25-005.json --artifact htdemucs.spectral.fp32.onnx --dest models/htdemucs.spectral.onnx
      - name: Run full-window smoke
        env:
          TARGET: ${{ matrix.target }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          ARCHIVE=$(python -c 'import sys; sys.path.insert(0, "scripts"); import repackage_nuget_runtime as r; print(r.archive_name(r.load_lock(), sys.argv[1]))' "$TARGET")
          python scripts/run_native_smoke.py --runtime "nuget/packages/$ARCHIVE" --model models/htdemucs.spectral.onnx --target "$TARGET" --provider "$PROVIDER" --ort-source nuget/headers --report smoke.json
  gate:
    name: Official Runtime Gate
    if: always()
    needs: [changes, repackage, smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REPACKAGE: ${{ needs.repackage.result }}
          RESULT: ${{ needs.smoke.result }}
          EXPECTED: ${{ needs.changes.outputs.run }}
        run: |
          test "$CHANGES" = success
          if [ "$EXPECTED" = true ]; then test "$REPACKAGE" = success && test "$RESULT" = success; else test "$RESULT" = skipped; fi
