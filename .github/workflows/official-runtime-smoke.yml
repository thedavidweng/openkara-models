name: Official runtime smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-official-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            files=$(gh api --paginate --jq '.[].filename' "repos/$GITHUB_REPOSITORY/pulls/$PR/files")
            if printf '%s\n' "$files" | grep -Eq '^(.github/workflows/|ort/|scripts/(archive_utils|run_native_smoke|download_stable_model|generate_catalog_v2)\.py|catalog/)'; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  smoke:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: onnxruntime-linux-x64-1.32.0.tgz
            sha256: bb169b7e374731730d2ae406fb39de7be4b315f413a9132efe896261c31bb503
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: onnxruntime-linux-aarch64-1.32.0.tgz
            sha256: 81a46251dd90da4122f4b9ceb4433f836fbc79ee1eddffca7c09033af81a1939
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: onnxruntime-osx-arm64-1.32.0.tgz
            sha256: 8ddca23f532b9d4fbb279ba9b08dab6c0ac94fdc9aec2eb44a1db7049216c043
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: onnxruntime-win-x64-1.32.0.zip
            sha256: aaa1d04fcf86bd31e84b90bc0cbde80e632bd0720dcc5d8ba05c4fe45c09d127
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/onnxruntime
          ref: fab30a46491a40f5e4c968b80e8a59acbbb91b53
          path: ort/source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Download and verify official archive
        env:
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
        shell: bash
        run: |
          curl -fsSL -o "$ARCHIVE" "https://github.com/microsoft/onnxruntime/releases/download/v1.32.0/$ARCHIVE"
          python -c 'import hashlib,os; p=os.environ["ARCHIVE"]; assert hashlib.file_digest(open(p,"rb"),"sha256").hexdigest() == os.environ["SHA256"]'
      - name: Download stable model
        run: python scripts/download_stable_model.py --catalog catalog/releases/2026-07-25-005.json --artifact htdemucs.spectral.fp32.onnx --dest models/htdemucs.spectral.onnx
      - name: Run full-window CPU smoke
        env:
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/run_native_smoke.py --runtime "$ARCHIVE" --model models/htdemucs.spectral.onnx --target "$TARGET" --provider cpu --ort-source ort/source --report smoke.json
  gate:
    name: Official Runtime Gate
    if: always()
    needs: [changes, smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.smoke.result }}
          EXPECTED: ${{ needs.changes.outputs.run }}
        run: |
          test "$CHANGES" = success
          if [ "$EXPECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
