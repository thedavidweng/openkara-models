name: ORT runtime publish (all targets + catalog entries)

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Catalog release ID to publish runtimes into (e.g. 2026-07-20-001)"
        required: true
        type: string
  push:
    tags:
      - "ort-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Build every target's reduced runtime, generate supply-chain, verify, and
  # upload. Each job produces a reduced runtime archive consumed by publish.
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # Both Linux targets build in dedicated manylinux jobs below — see
          # build-x86_64-linux / build-aarch64-linux for the glibc-floor
          # rationale.
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          # Windows CPU-only runtime (issue OpenKara/OpenKara#284): no
          # DirectML import so the DLL loads on hosts where DirectML hangs.
          - target: x86_64-pc-windows-msvc-cpu
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"
      # Reduced build: derive the operator set from the spectral stable model,
      # then prune every other kernel. The config is regenerated here (not
      # committed) so build_runtime --reduced can consume it.
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for ${{ matrix.target }}
        run: python scripts/build_runtime.py --target ${{ matrix.target }} --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-${{ matrix.target }}
          path: ort/packages/onnxruntime-*-${{ matrix.target }}-reduced.*
          retention-days: 14

  # Linux x64 builds inside manylinux_2_28 with gcc-toolset-13: the glibc
  # symbol floor must stay below OpenKara's ubuntu-22.04 release baseline,
  # and 22.04's own binutils cannot assemble ORT's AVX-NE-CONVERT kernels.
  # Keep in lockstep with the same job in ort-build.yml.
  build-x86_64-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (gcc-toolset-13 + cmake + onnx + python 3.11)
        run: |
          dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          /opt/python/cp311-cp311/bin/python -m pip install "cmake>=3.28" "onnx>=1.22.0" flatbuffers "numpy>=1.24"
          {
            echo "/opt/rh/gcc-toolset-13/root/usr/bin"
            echo "/opt/python/cp311-cp311/bin"
          } >> "$GITHUB_PATH"
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for x86_64-unknown-linux-gnu
        run: python scripts/build_runtime.py --locked --target x86_64-unknown-linux-gnu --reduced
      - name: Verify ABI floor against the release baseline
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/check_linux_abi_floor.py \
            --archive "$RUNTIME" \
            --max-glibc 2.35 --max-glibcxx 3.4.30 --max-cxxabi 1.3.13
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-unknown-linux-gnu
          path: ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz
          retention-days: 14

  # Linux arm64 builds inside manylinux_2_28 arm64 for the same reason: the
  # glibc symbol floor is set by the build environment, and the ubuntu-24.04
  # arm64 runner produced GLIBC_2.38 references, above OpenKara's ubuntu-22.04
  # baseline (glibc 2.35). Keep in lockstep with the same job in ort-build.yml.
  build-aarch64-linux:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (gcc-toolset-13 + cmake + onnx + python 3.11)
        run: |
          dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          /opt/python/cp311-cp311/bin/python -m pip install "cmake>=3.28" "onnx>=1.22.0" flatbuffers "numpy>=1.24"
          {
            echo "/opt/rh/gcc-toolset-13/root/usr/bin"
            echo "/opt/python/cp311-cp311/bin"
          } >> "$GITHUB_PATH"
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for aarch64-unknown-linux-gnu
        run: python scripts/build_runtime.py --locked --target aarch64-unknown-linux-gnu --reduced
      - name: Verify ABI floor against the release baseline
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-aarch64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/check_linux_abi_floor.py \
            --archive "$RUNTIME" \
            --max-glibc 2.35 --max-glibcxx 3.4.30 --max-cxxabi 1.3.13
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-aarch64-unknown-linux-gnu
          path: ort/packages/onnxruntime-*-aarch64-unknown-linux-gnu-reduced.tar.gz
          retention-days: 14

  # Publish: download all reduced archives, regenerate the required-operator
  # config (so verify's ops_config_sha256 gate can revalidate it), generate
  # catalog entries, create a GitHub release with the archives as assets, and
  # emit the catalog spec fragment for merge into the release spec. The
  # required-operators sidecar is uploaded as an artifact for auditability of
  # the reduced operator set.
  publish:
    permissions:
      contents: write
    needs: [build, build-x86_64-linux, build-aarch64-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"

      - name: Download all runtime artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ort-*
          path: ort/packages
          merge-multiple: true

      # Re-derive the identical reduced-operator config so verify_runtime_package
      # can re-check each reduced archive's ops_config_sha256 against it.
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx

      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx

      - name: Verify all packages
        run: python scripts/verify_runtime_package.py --all

      - name: Generate runtime catalog entries
        env:
          RELEASE_ID: ${{ inputs.release_id || github.ref_name }}
        run: |
          python scripts/generate_runtime_catalog_entries.py \
            --release "$RELEASE_ID" \
            --output catalog/specs/runtime-entries.json

      - name: Create GitHub release + upload archives
        env:
          RELEASE_TAG: ${{ inputs.release_id && format('infra-{0}', inputs.release_id) || github.ref_name }}
          RELEASE_TITLE: ${{ github.ref_name || inputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          gh release create "$TAG" \
            --title "ORT runtime $RELEASE_TITLE" \
            --notes "Source-built, reduced-operator ONNX Runtime archives for 6 targets. See catalog/specs/runtime-entries.json for the catalog spec fragment and runtime-required-operators for the operator set." \
            ort/packages/onnxruntime-*.tar.gz ort/packages/onnxruntime-*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-catalog-entries
          path: catalog/specs/runtime-entries.json
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-required-operators
          path: |
            ort/required-operators.config
            ort/required-operators.json
          retention-days: 30
