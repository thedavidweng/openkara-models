name: Dependency detection (ORT + model weights)

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "models/source-lock.json"
      - "scripts/detect_model_weight_revision.py"
      - "scripts/detect_ort_release.py"
      - "scripts/validate_model_source_lock.py"
      - "scripts/generate_dep_candidate.py"
      - "scripts/dispatch_dep_candidate.py"
      - "tests/test_dep_detection.py"
      - "tests/test_dep_candidate.py"
      - ".github/workflows/dep-detection.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR-time validation of the model source lock and detection/candidate
  # scripts. Detection jobs poll upstream APIs and only run on schedule
  # or manual dispatch.
  validate-locks:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate model source lock
        run: python scripts/validate_model_source_lock.py
      - name: Detection + candidate tests
        run: |
          pip install "pytest>=8.0"
          python -m pytest tests/test_dep_detection.py tests/test_dep_candidate.py -q
      - name: Syntax check detection scripts
        run: python -m compileall -q scripts/detect_model_weight_revision.py scripts/detect_ort_release.py scripts/validate_model_source_lock.py scripts/generate_dep_candidate.py

  detect-ort:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Detect ORT release
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/detect_ort_release.py --json > /tmp/ort-detection.json
          EXIT_CODE=$?
          cat /tmp/ort-detection.json
          if [ $EXIT_CODE -eq 0 ]; then
            {
              echo "update_available=true"
              echo "latest_tag=$(python3 -c "import json; print(json.load(open('/tmp/ort-detection.json'))['latest']['tag'])")"
              echo "latest_commit=$(python3 -c "import json; print(json.load(open('/tmp/ort-detection.json'))['latest']['commit_sha'])")"
            } >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "API failure (exit $EXIT_CODE)"
            exit 1
          fi
      - name: Dispatch new ORT candidate (prepare only)
        if: steps.detect.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORT_TAG: ${{ steps.detect.outputs.latest_tag }}
          ORT_COMMIT: ${{ steps.detect.outputs.latest_commit }}
        run: |
          python scripts/dispatch_dep_candidate.py --ort-tag "$ORT_TAG" --ort-commit "$ORT_COMMIT"
      - name: Detection tests
        run: |
          pip install "pytest>=8.0"
          python -m pytest tests/test_dep_detection.py -q

  detect-model-weights:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      matrix:
        model: [htdemucs, htdemucs_ft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Detect ${{ matrix.model }} weight revision
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/detect_model_weight_revision.py --model ${{ matrix.model }} --lock models/source-lock.json --json > /tmp/model-detection.json
          EXIT_CODE=$?
          cat /tmp/model-detection.json
          if [ $EXIT_CODE -eq 0 ]; then
            {
              echo "update_available=true"
              echo "latest_commit=$(python3 -c "import json; print(json.load(open('/tmp/model-detection.json'))['latest']['commit_sha'])")"
            } >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "API failure or missing lock (exit $EXIT_CODE)"
            exit 1
          fi
      - name: Dispatch new model candidate (prepare only)
        if: steps.detect.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ matrix.model }}
          MODEL_COMMIT: ${{ steps.detect.outputs.latest_commit }}
        run: |
          python scripts/dispatch_dep_candidate.py --model "$MODEL" --model-commit "$MODEL_COMMIT"
