name: ORT source build (6 targets)

on:
  workflow_call:
    inputs:
      candidate_lock_artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      linux_only:
        description: "Build only the Linux targets (skips the Apple and Windows jobs)"
        required: false
        type: boolean
        default: false
      full_only:
        description: "Build only the full (non-reduced) runtime archives missing from the 11-family candidate set"
        required: false
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "ort/**"
      - "scripts/build_runtime.py"
      - "scripts/verify_runtime_package.py"
      - "scripts/validate_source_lock.py"
      - "scripts/generate_required_operators.py"
      - "scripts/compare_runtime_builds.py"
      - "scripts/generate_runtime_supply_chain.py"
      - "scripts/native_quality.py"
      - "tests/test_native_quality.py"
      - "scripts/run_runtime_benchmarks.py"
      - "scripts/validate_benchmark_report.py"
      - "scripts/generate_runtime_catalog_entries.py"
      - "scripts/archive_utils.py"
      - "scripts/ort_api_version.py"
      - "scripts/run_native_smoke.py"
      - "scripts/download_stable_model.py"
      - "scripts/runtime_inputs.py"
      - "tests/test_source_lock.py"
      - "tests/test_required_operators.py"
      - "tests/test_compare_runtime_builds.py"
      - "tests/test_runtime_supply_chain.py"
      - "tests/test_benchmark_report.py"
      - "tests/test_runtime_catalog_entries.py"
      - "tests/test_archive_utils.py"
      - "tests/test_ort_api_version.py"
      - "tests/test_native_smoke.py"
      - "tests/test_profile_parser.py"
      - ".github/workflows/ort-build.yml"
  push:
    branches: [main]
    paths:
      - "ort/**"
      - "scripts/build_runtime.py"
      - "scripts/verify_runtime_package.py"
      - "scripts/validate_source_lock.py"
      - "scripts/generate_required_operators.py"
      - "scripts/compare_runtime_builds.py"
      - "scripts/generate_runtime_supply_chain.py"
      - "scripts/native_quality.py"
      - "tests/test_native_quality.py"
      - "scripts/run_runtime_benchmarks.py"
      - "scripts/validate_benchmark_report.py"
      - "scripts/generate_runtime_catalog_entries.py"
      - "scripts/archive_utils.py"
      - "scripts/ort_api_version.py"
      - "scripts/run_native_smoke.py"
      - "scripts/download_stable_model.py"
      - "scripts/runtime_inputs.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ort-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-lock:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install "pytest>=8.0" "onnx>=1.22.0" "jsonschema>=4.20"
      - name: Validate source lock
        run: python scripts/validate_source_lock.py
      - name: Source lock + required-operator + comparison + supply-chain + benchmark + catalog-entry + archive + api-version + smoke + profile-parser tests
        run: |
          python -m pytest tests/test_source_lock.py tests/test_required_operators.py tests/test_native_quality.py tests/test_compare_runtime_builds.py tests/test_runtime_supply_chain.py tests/test_benchmark_report.py tests/test_runtime_catalog_entries.py tests/test_archive_utils.py tests/test_ort_api_version.py tests/test_native_smoke.py tests/test_profile_parser.py -q
      - name: Syntax check build scripts
        run: python -m compileall -q scripts/build_runtime.py scripts/verify_runtime_package.py scripts/validate_source_lock.py scripts/generate_required_operators.py scripts/native_quality.py scripts/compare_runtime_builds.py scripts/generate_runtime_supply_chain.py scripts/run_runtime_benchmarks.py scripts/validate_benchmark_report.py scripts/generate_runtime_catalog_entries.py scripts/archive_utils.py scripts/ort_api_version.py scripts/run_native_smoke.py scripts/download_stable_model.py scripts/runtime_inputs.py

  build-aarch64-apple-darwin:
    if: ${{ inputs.full_only != true && ((github.event_name == 'workflow_dispatch' && !inputs.linux_only) || github.event_name == 'workflow_call') }}
    needs: validate-source-lock
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"
      # Reduced build: derive the operator set from the spectral stable model,
      # then prune every other kernel (matches the ort-publish.yml template, so
      # CI builds the same reduced runtime that publish ships).
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for aarch64-apple-darwin
        run: python scripts/build_runtime.py --locked --target aarch64-apple-darwin --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Run native smoke harness (CPU + CoreML)
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-aarch64-apple-darwin-reduced.tar.gz)
          for PROV in cpu coreml; do
            python scripts/run_native_smoke.py \
              --runtime "$RUNTIME" \
              --model models/htdemucs.spectral.onnx \
              --target aarch64-apple-darwin \
              --provider "$PROV" \
              --ort-source ort/source \
              --report "smoke-aarch64-apple-darwin-${PROV}.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-aarch64-apple-darwin
          path: |
            ort/packages/onnxruntime-*-aarch64-apple-darwin-reduced.tar.gz
            smoke-aarch64-apple-darwin-*.json
          retention-days: 14

  build-x86_64-apple-darwin:
    if: ${{ inputs.full_only != true && ((github.event_name == 'workflow_dispatch' && !inputs.linux_only) || github.event_name == 'workflow_call') }}
    needs: validate-source-lock
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"
      # Reduced build: derive the operator set from the spectral stable model,
      # then prune every other kernel (matches the ort-publish.yml template, so
      # CI builds the same reduced runtime that publish ships).
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for x86_64-apple-darwin
        run: python scripts/build_runtime.py --locked --target x86_64-apple-darwin --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Run native smoke harness (CPU + XNNPACK)
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-apple-darwin-reduced.tar.gz)
          for PROV in cpu xnnpack; do
            python scripts/run_native_smoke.py \
              --runtime "$RUNTIME" \
              --model models/htdemucs.spectral.onnx \
              --target x86_64-apple-darwin \
              --provider "$PROV" \
              --ort-source ort/source \
              --report "smoke-x86_64-apple-darwin-${PROV}.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-apple-darwin
          path: |
            ort/packages/onnxruntime-*-x86_64-apple-darwin-reduced.tar.gz
            smoke-x86_64-apple-darwin-*.json
          retention-days: 14

  build-x86_64-unknown-linux-gnu:
    # Runs after the paired Apple jobs by default. A linux_only dispatch skips
    # those jobs, so the condition tolerates them being skipped while still
    # requiring validate-source-lock; !cancelled() is what lets a job run
    # when its `needs` were skipped.
    if: ${{ inputs.full_only != true && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && needs.validate-source-lock.result == 'success' && (inputs.linux_only || (needs.build-aarch64-apple-darwin.result == 'success' && needs.build-x86_64-apple-darwin.result == 'success')) }}
    needs: [validate-source-lock, build-aarch64-apple-darwin, build-x86_64-apple-darwin]
    runs-on: ubuntu-latest
    # manylinux_2_28 container: the artifact's glibc symbol floor is set by
    # the build environment, and OpenKara's Linux release baseline is
    # ubuntu-22.04 (glibc 2.35). manylinux_2_28 builds against glibc 2.28 —
    # comfortably below the baseline — while gcc-toolset-13 provides the
    # gcc 13 + binutils 2.40 the source lock and ORT's AVX-NE-CONVERT mlas
    # kernels require (22.04's binutils 2.38 cannot assemble them, which is
    # why a plain ubuntu-22.04 runner cannot build this target).
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - name: Install build deps (gcc-toolset-13 + cmake + python 3.11)
        run: |
          dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          /opt/python/cp311-cp311/bin/python -m pip install "cmake>=3.28"
          {
            echo "/opt/rh/gcc-toolset-13/root/usr/bin"
            echo "/opt/python/cp311-cp311/bin"
          } >> "$GITHUB_PATH"
      - name: Verify toolchain floor
        run: |
          gcc --version | head -1
          as --version | head -1
          cmake --version | head -1
          python --version
          ldd --version | head -1
      - name: Build ORT for x86_64-unknown-linux-gnu
        run: python scripts/build_runtime.py --locked --target x86_64-unknown-linux-gnu
      - name: Verify ABI floor against the release baseline
        run: |
          RUNTIME=""
          for ARCHIVE in ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu.tar.gz; do
            [ -e "$ARCHIVE" ] || continue
            case "$ARCHIVE" in *reduced*) continue ;; esac
            RUNTIME="$ARCHIVE"
          done
          python scripts/check_linux_abi_floor.py \
            --archive "$RUNTIME" \
            --max-glibc 2.35 --max-glibcxx 3.4.30 --max-cxxabi 1.3.13
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Run native smoke harness (CPU + XNNPACK)
        run: |
          RUNTIME=""
          for ARCHIVE in ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu.tar.gz; do
            [ -e "$ARCHIVE" ] || continue
            case "$ARCHIVE" in *reduced*) continue ;; esac
            RUNTIME="$ARCHIVE"
          done
          for PROV in cpu xnnpack; do
            python scripts/run_native_smoke.py \
              --runtime "$RUNTIME" \
              --model models/htdemucs.spectral.onnx \
              --target x86_64-unknown-linux-gnu \
              --provider "$PROV" \
              --ort-source ort/source \
              --report "smoke-x86_64-unknown-linux-gnu-${PROV}.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-unknown-linux-gnu
          path: |
            ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu.tar.gz
            smoke-x86_64-unknown-linux-gnu-*.json
          retention-days: 14

  build-aarch64-unknown-linux-gnu:
    # Runs after the paired Apple jobs by default. A linux_only dispatch skips
    # those jobs, so the condition tolerates them being skipped while still
    # requiring validate-source-lock; !cancelled() is what lets a job run
    # when its `needs` were skipped.
    if: ${{ inputs.full_only != true && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && needs.validate-source-lock.result == 'success' && (inputs.linux_only || (needs.build-aarch64-apple-darwin.result == 'success' && needs.build-x86_64-apple-darwin.result == 'success')) }}
    needs: [validate-source-lock, build-aarch64-apple-darwin, build-x86_64-apple-darwin]
    runs-on: ubuntu-24.04-arm
    # manylinux_2_28 arm64 container for the same reason as the x86_64 Linux
    # jobs: the glibc symbol floor is set by the build environment. Built
    # directly on the ubuntu-24.04 arm64 runner the library references
    # GLIBC_2.38, above OpenKara's ubuntu-22.04 baseline (glibc 2.35);
    # manylinux_2_28 builds against glibc 2.28 and gcc-toolset-13 keeps the
    # locked gcc 13.
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - name: Install build deps (gcc-toolset-13 + cmake + python 3.11)
        run: |
          dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          /opt/python/cp311-cp311/bin/python -m pip install "cmake>=3.28" "onnx>=1.22.0" "flatbuffers" "numpy>=1.24"
          {
            echo "/opt/rh/gcc-toolset-13/root/usr/bin"
            echo "/opt/python/cp311-cp311/bin"
          } >> "$GITHUB_PATH"
      - name: Verify toolchain floor
        run: |
          gcc --version | head -1
          as --version | head -1
          cmake --version | head -1
          python --version
          ldd --version | head -1
      # Reduced build: derive the operator set from the spectral stable model,
      # then prune every other kernel (matches the ort-publish.yml template, so
      # CI builds the same reduced runtime that publish ships).
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for aarch64-unknown-linux-gnu
        run: python scripts/build_runtime.py --locked --target aarch64-unknown-linux-gnu --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Verify ABI floor against the release baseline
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-aarch64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/check_linux_abi_floor.py \
            --archive "$RUNTIME" \
            --max-glibc 2.35 --max-glibcxx 3.4.30 --max-cxxabi 1.3.13
      - name: Run native smoke harness (CPU + XNNPACK)
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-aarch64-unknown-linux-gnu-reduced.tar.gz)
          for PROV in cpu xnnpack; do
            python scripts/run_native_smoke.py \
              --runtime "$RUNTIME" \
              --model models/htdemucs.spectral.onnx \
              --target aarch64-unknown-linux-gnu \
              --provider "$PROV" \
              --ort-source ort/source \
              --report "smoke-aarch64-unknown-linux-gnu-${PROV}.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-aarch64-unknown-linux-gnu
          path: |
            ort/packages/onnxruntime-*-aarch64-unknown-linux-gnu-reduced.tar.gz
            smoke-aarch64-unknown-linux-gnu-*.json
          retention-days: 14

  build-x86_64-pc-windows-msvc:
    if: ${{ inputs.full_only != true && ((github.event_name == 'workflow_dispatch' && !inputs.linux_only) || github.event_name == 'workflow_call') }}
    needs: [validate-source-lock, build-x86_64-unknown-linux-gnu, build-aarch64-unknown-linux-gnu]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PATCH_EXECUTABLE: C:/msys64/usr/bin/patch.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"
      # ORT applies cmake/patches/onnx/onnx.patch to onnx v1.22.0 via FetchContent.
      # scoped_resource.h context has whitespace mismatches that fail on older
      # patch utilities (such as Git for Windows' patch 2.7.6). Explicitly install
      # GNU patch >= 2.8 via MSYS2 and select it for CMake configure.
      - name: Install GNU patch >= 2.8 via MSYS2
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed patch
          C:/msys64/usr/bin/patch.exe --version
      # Reduced build: derive the operator set from the spectral stable model,
      # then prune every other kernel (matches the ort-publish.yml template, so
      # CI builds the same reduced runtime that publish ships).
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced ORT for x86_64-pc-windows-msvc
        run: python scripts/build_runtime.py --locked --target x86_64-pc-windows-msvc --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Run native smoke harness (CPU + DirectML)
        shell: bash
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-pc-windows-msvc-reduced.zip)
          # CPU always runs with the full strict gate.
          python scripts/run_native_smoke.py \
            --runtime "$RUNTIME" \
            --model models/htdemucs.spectral.onnx \
            --target x86_64-pc-windows-msvc \
            --provider cpu \
            --ort-source ort/source \
            --report "smoke-x86_64-pc-windows-msvc-cpu.json"
          # DirectML requires a GPU. GitHub-hosted Windows runners do not have
          # one, so --allow-skip-no-gpu records diagnostic absence (exit 0
          # with a "skipped" report) when no display adapter is available.
          # This does NOT qualify DirectML for release; GPU evidence is required.
          python scripts/run_native_smoke.py \
            --runtime "$RUNTIME" \
            --model models/htdemucs.spectral.onnx \
            --target x86_64-pc-windows-msvc \
            --provider directml \
            --ort-source ort/source \
            --report "smoke-x86_64-pc-windows-msvc-directml.json" \
            --allow-skip-no-gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-pc-windows-msvc
          path: |
            ort/packages/onnxruntime-*-x86_64-pc-windows-msvc-reduced.zip
            smoke-x86_64-pc-windows-msvc-*.json
          retention-days: 14

  # Windows CPU-only runtime (issue OpenKara/OpenKara#284). A virtual display
  # adapter can pass the D3D12 capability probe yet deadlock while loading
  # DirectML.dll during ORT initialization. This artifact links no DirectML
  # import, so it loads on any Windows host. Built reduced to match the
  # DirectML reduced runtime the publish flow ships.
  build-x86_64-pc-windows-msvc-cpu:
    if: ${{ inputs.full_only != true && ((github.event_name == 'workflow_dispatch' && !inputs.linux_only) || github.event_name == 'workflow_call') }}
    needs: [validate-source-lock, build-x86_64-unknown-linux-gnu, build-aarch64-unknown-linux-gnu]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PATCH_EXECUTABLE: C:/msys64/usr/bin/patch.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python deps (onnx for required-operator config)
        run: python -m pip install "onnx>=1.22.0" flatbuffers "numpy>=1.24"
      # ORT applies cmake/patches/onnx/onnx.patch to onnx v1.22.0 via FetchContent.
      # scoped_resource.h context has whitespace mismatches that fail on older
      # patch utilities (such as Git for Windows' patch 2.7.6). Explicitly install
      # GNU patch >= 2.8 via MSYS2 and select it for CMake configure.
      - name: Install GNU patch >= 2.8 via MSYS2
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed patch
          C:/msys64/usr/bin/patch.exe --version
      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx
      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx
      - name: Build reduced CPU-only ORT for x86_64-pc-windows-msvc-cpu
        run: python scripts/build_runtime.py --locked --target x86_64-pc-windows-msvc-cpu --reduced
      - name: Generate supply-chain records (SBOM + provenance)
        run: python scripts/generate_runtime_supply_chain.py --all
      - name: Verify package (incl. supply-chain)
        run: python scripts/verify_runtime_package.py --all
      - name: Run native smoke harness (CPU only — no DirectML import)
        shell: bash
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-pc-windows-msvc-cpu-reduced.zip)
          python scripts/run_native_smoke.py \
            --runtime "$RUNTIME" \
            --model models/htdemucs.spectral.onnx \
            --target x86_64-pc-windows-msvc-cpu \
            --provider cpu \
            --ort-source ort/source \
            --report "smoke-x86_64-pc-windows-msvc-cpu-cpu.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-pc-windows-msvc-cpu
          path: |
            ort/packages/onnxruntime-*-x86_64-pc-windows-msvc-cpu-reduced.zip
            smoke-x86_64-pc-windows-msvc-cpu-*.json
          retention-days: 14

  # Reduced-operator build + full-vs-reduced comparison for x86_64 Linux.
  # Downloads the full build artifact, generates the required-operator config
  # from the stable catalog model, builds the reduced runtime, and compares
  # archive size + inference output. Fails if the reduced runtime cannot load
  # the model (a required kernel was pruned) or output diverges.
  reduced-build-and-compare:
    if: ${{ inputs.full_only != true && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.candidate_lock_artifact == '' && needs.validate-source-lock.result == 'success' && needs.build-x86_64-unknown-linux-gnu.result == 'success' }}
    needs: [validate-source-lock, build-x86_64-unknown-linux-gnu]
    # Must run in the same manylinux_2_28 container as the full build above.
    # The glibc symbol floor of a shared library is fixed by the headers and
    # libc it links against, not by the CMake flags — building this reduced
    # vendor on a newer distro runner raised its floor to GLIBC_2.38 while the
    # full archive stayed at GLIBC_2.27, so the reduced deliverable would not
    # load on OpenKara's ubuntu-22.04 baseline (glibc 2.35). gcc-toolset-13
    # also keeps the source lock's gcc 13 pin on this image.
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (gcc-toolset-13 + cmake + python 3.11)
        run: |
          dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          /opt/python/cp311-cp311/bin/python -m pip install "cmake>=3.28" "numpy>=1.24" "onnx>=1.23.2" "flatbuffers==25.12.19"
          {
            echo "/opt/rh/gcc-toolset-13/root/usr/bin"
            echo "/opt/python/cp311-cp311/bin"
          } >> "$GITHUB_PATH"
      - name: Verify toolchain floor
        run: |
          gcc --version | head -1
          as --version | head -1
          cmake --version | head -1
          python --version
          ldd --version | head -1

      - name: Download full build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ort-x86_64-unknown-linux-gnu
          path: .
          merge-multiple: true

      - name: Download stable model from catalog
        run: >
          python scripts/download_stable_model.py
          --catalog catalog/releases/2026-07-25-005.json
          --artifact htdemucs.spectral.fp32.onnx
          --dest models/htdemucs.spectral.onnx

      - name: Generate required-operator config
        run: python scripts/generate_required_operators.py --models models/htdemucs.spectral.onnx

      - name: Build reduced runtime
        run: python scripts/build_runtime.py --locked --target x86_64-unknown-linux-gnu --reduced

      - name: Generate supply-chain records for reduced runtime
        run: |
          REDUCED=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/generate_runtime_supply_chain.py --archive "$REDUCED"

      - name: Verify reduced package
        run: python scripts/verify_runtime_package.py --all

      - name: Verify ABI floor against the release baseline
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/check_linux_abi_floor.py \
            --archive "$RUNTIME" \
            --max-glibc 2.35 --max-glibcxx 3.4.30 --max-cxxabi 1.3.13

      - name: Run reduced native smoke harness (CPU + XNNPACK)
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          for PROV in cpu xnnpack; do
            python scripts/run_native_smoke.py \
              --runtime "$RUNTIME" \
              --model models/htdemucs.spectral.onnx \
              --target x86_64-unknown-linux-gnu \
              --provider "$PROV" \
              --ort-source ort/source \
              --report "smoke-x86_64-unknown-linux-gnu-reduced-${PROV}.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-x86_64-unknown-linux-gnu-reduced
          path: |
            smoke-x86_64-unknown-linux-gnu-reduced-cpu.json
            smoke-x86_64-unknown-linux-gnu-reduced-xnnpack.json
          if-no-files-found: error
          retention-days: 14

      - name: Compare full vs reduced (size + inference)
        run: |
          FULL=""
          for ARCHIVE in ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu.tar.gz; do
            [ -e "$ARCHIVE" ] || continue
            case "$ARCHIVE" in *reduced*) continue ;; esac
            FULL="$ARCHIVE"
          done
          REDUCED=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/compare_runtime_builds.py \
            --full "$FULL" --reduced "$REDUCED" \
            --model models/htdemucs.spectral.onnx --frames 343980 \
            --warmup 1 --iters 3 --tolerance 0.0 \
            --report runtime-comparison-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-comparison-report
          path: runtime-comparison-report.json
          retention-days: 30

      # Publish the reduced archive this job built so the benchmark job can
      # measure the actual reduced deliverable (Linux x64 is the only reduced
      # x86_64 archive produced in this workflow — the build job stays full as
      # this job's comparison baseline). The comparison above is unchanged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-unknown-linux-gnu-reduced
          path: ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz
          retention-days: 14

  # Native compatibility + performance benchmark for the reduced x86_64 Linux
  # deliverable. Runs one full 343980-frame stereo inference window on the
  # reduced runtime, recording session load, latency, peak RSS, provider
  # assignment, fallback node count, and output shape/finite check. Fails if
  # the model cannot load, output contains NaN/Inf, or shape mismatches. The
  # report is validated against ort/benchmark-report-v1.json and uploaded.
  benchmark-x86_64-unknown-linux-gnu:
    if: ${{ inputs.full_only != true && github.event_name == 'workflow_dispatch' && inputs.candidate_lock_artifact == '' && !inputs.linux_only }}
    needs: [validate-source-lock, reduced-build-and-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install "numpy>=1.24" "jsonschema>=4.20"

      # upload-artifact roots the archive at the least common ancestor of the
      # matched files; this artifact holds a single file from ort/packages, so
      # its entry is at the archive root and must be restored into that
      # directory explicitly (the multi-path build artifacts keep their
      # ort/packages/ prefix because they also match repo-root smoke reports).
      - name: Download reduced runtime build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ort-x86_64-unknown-linux-gnu-reduced
          path: ort/packages
          merge-multiple: true

      - name: Run native benchmark (reduced runtime, full 343980-frame window)
        run: |
          RUNTIME=$(ls ort/packages/onnxruntime-*-x86_64-unknown-linux-gnu-reduced.tar.gz)
          python scripts/run_runtime_benchmarks.py \
            --runtime "$RUNTIME" \
            --catalog catalog/releases/2026-07-25-005.json \
            --model-artifact-id htdemucs.spectral.fp32.onnx \
            --target x86_64-unknown-linux-gnu \
            --frames 343980 --warmup 1 --iters 3 \
            --report benchmark-x86_64-unknown-linux-gnu.json

      - name: Validate benchmark report
        run: python scripts/validate_benchmark_report.py benchmark-x86_64-unknown-linux-gnu.json --tier release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-x86_64-unknown-linux-gnu
          path: benchmark-x86_64-unknown-linux-gnu.json
          retention-days: 30

  # Full (non-reduced) counterparts for the 11-family candidate set. The
