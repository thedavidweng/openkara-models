name: Intel macOS runtime

on:
  pull_request:
    paths:
      - ort/source-lock.json
      - scripts/build_runtime.py
      - scripts/ort_api_version.py
  push:
    branches: [main]
    paths:
      - ort/source-lock.json
      - scripts/build_runtime.py
      - scripts/ort_api_version.py
  workflow_call:
    inputs:
      candidate_lock_artifact:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-intel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intel:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_lock_artifact != ''
        with:
          name: ${{ inputs.candidate_lock_artifact }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Identify source commit
        id: source
        run: echo "commit=$(python -c 'import json; print(json.load(open("ort/source-lock.json"))["upstream"]["commit_sha"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime-cache
        with:
          path: ort/packages
          key: ort-intel-${{ steps.source.outputs.commit }}-${{ hashFiles('ort/source-lock.json', 'scripts/build_runtime.py', 'scripts/ort_api_version.py') }}
      - name: Build full operator runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python scripts/build_runtime.py --locked --target x86_64-apple-darwin
      - name: Obtain source headers on cache hit
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: python -c 'import sys; sys.path.insert(0, "scripts"); import build_runtime as b; b._clone_source(b._load_lock(), b.SOURCE_DIR)'
      - name: Check Intel runtime deployment target
        run: |
          archive=$(find ort/packages -name '*x86_64-apple-darwin.tar.gz' -print -quit)
          mkdir runtime-check
          tar -xzf "$archive" -C runtime-check
          library=$(find runtime-check -name 'libonnxruntime.*.dylib' -type f -print -quit)
          xcrun vtool -show-build "$library" | tee runtime-build-version.txt
          grep -Eq 'minos 10\.15([. ]|$)' runtime-build-version.txt
      - name: Download stable model
        run: python scripts/download_stable_model.py --catalog catalog/releases/2026-07-25-005.json --artifact htdemucs.spectral.fp32.onnx --dest models/htdemucs.spectral.onnx
      - name: Build x86_64 smoke harness
        run: |
          cmake -S ort/smoke -B ort/smoke/build -DORT_SOURCE_DIR="$PWD/ort/source" -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_BUILD_TYPE=Release
          cmake --build ort/smoke/build --parallel 2
          file ort/smoke/build/ort_smoke
      - name: Run full-window smoke under Rosetta
        run: |
          archive=$(find ort/packages -name '*x86_64-apple-darwin.tar.gz' -print -quit)
          test -n "$archive"
          python scripts/run_native_smoke.py --runtime "$archive" --model models/htdemucs.spectral.onnx --target x86_64-apple-darwin --provider cpu --ort-source ort/source --harness ort/smoke/build/ort_smoke --report smoke-intel.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-x86_64-apple-darwin
          path: |
            ort/packages/*x86_64-apple-darwin.tar.gz
            smoke-intel.json
          if-no-files-found: error
          retention-days: 30
