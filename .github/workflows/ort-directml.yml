name: DirectML comparison runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PATCH_EXECUTABLE: C:/msys64/usr/bin/patch.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install GNU patch
        shell: bash
        run: C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed patch
      - name: Build DirectML runtime
        run: python scripts/build_runtime.py --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ort-directml-comparison
          path: ort/packages/*x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 30
