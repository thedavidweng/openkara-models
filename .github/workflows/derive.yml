name: Derive model artifacts (dedup + karaoke_2stem)

on:
  pull_request:
    paths:
      - "scripts/dedupe_onnx_initializers.py"
      - "scripts/derive_karaoke_2stem.py"
      - "scripts/verify_derived_model.py"
      - "scripts/benchmark_model_variants.py"
      - "tests/test_model_derivation.py"
      - ".github/workflows/derive.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for the derived artifacts (e.g. model-derived-v1.0.0). Empty = build + verify only, no release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  # PR-time: unit tests on tiny synthetic graphs (no model downloads).
  derivation-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install deps (no torch)
        run: pip install "onnx>=1.22.0" "onnxruntime>=1.27.0,<2" "numpy>=1.24" "pytest>=8.0"
      - name: Derivation unit tests
        run: python -m pytest tests/test_model_derivation.py -q
      - name: Syntax check derivation scripts
        run: python -m compileall -q scripts/dedupe_onnx_initializers.py scripts/derive_karaoke_2stem.py scripts/verify_derived_model.py scripts/benchmark_model_variants.py

  # Dispatch: derive from the stable catalog models, verify numerically,
  # and (optionally) publish the derived artifacts as a GitHub release.
  derive-and-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install deps (no torch)
        run: pip install "onnx>=1.22.0" "onnxruntime>=1.27.0,<2" "numpy>=1.24"

      - name: Resolve stable release manifest
        id: stable
        run: |
          release_id="$(python -c 'import json; print(json.load(open("catalog/channels/stable.json"))["release_id"])')"
          echo "manifest=catalog/releases/${release_id}.json" >> "$GITHUB_OUTPUT"
          echo "Stable release: ${release_id}"

      - name: Download stable source models (digest-verified)
        run: |
          python scripts/download_stable_model.py --catalog "${{ steps.stable.outputs.manifest }}" \
            --artifact htdemucs.balanced.fp32.onnx --dest work/htdemucs.onnx
          python scripts/download_stable_model.py --catalog "${{ steps.stable.outputs.manifest }}" \
            --artifact htdemucs_ft.quality.fp32.onnx --dest work/htdemucs_ft.onnx

      - name: Derive artifacts
        run: |
          python scripts/dedupe_onnx_initializers.py \
            --input work/htdemucs_ft.onnx --output work/htdemucs_ft.dedup.fp32.onnx
          python scripts/derive_karaoke_2stem.py --keep-four-stem \
            --input work/htdemucs.onnx --output work/htdemucs.dual.fp32.onnx
          python scripts/derive_karaoke_2stem.py --keep-four-stem \
            --input work/htdemucs_ft.dedup.fp32.onnx --output work/htdemucs_ft.dual.fp32.onnx

      - name: Verify derived artifacts (numeric equivalence)
        run: |
          python scripts/verify_derived_model.py \
            --source work/htdemucs_ft.onnx --derived work/htdemucs_ft.dedup.fp32.onnx \
            --mode dedup --fixtures white_noise multitone \
            --report work/verify-ft-dedup.json
          rm -f work/htdemucs_ft.onnx
          python scripts/verify_derived_model.py \
            --source work/htdemucs.onnx --derived work/htdemucs.dual.fp32.onnx \
            --mode dual --fixtures white_noise multitone \
            --report work/verify-h-dual.json
          python scripts/verify_derived_model.py \
            --source work/htdemucs_ft.dedup.fp32.onnx --derived work/htdemucs_ft.dual.fp32.onnx \
            --mode dual --fixtures white_noise multitone \
            --report work/verify-ft-dual.json

      - name: Runtime contract check (forbidden domains + reduced-op set)
        run: |
          for f in work/htdemucs_ft.dedup.fp32.onnx work/htdemucs.dual.fp32.onnx work/htdemucs_ft.dual.fp32.onnx; do
            python scripts/onnx_runtime_contract.py --model "$f" --ort-session
          done

      - name: Checksums
        run: |
          cd work
          shasum -a 256 htdemucs_ft.dedup.fp32.onnx htdemucs.dual.fp32.onnx htdemucs_ft.dual.fp32.onnx > derived-models.sha256
          cat derived-models.sha256

      - name: Upload verification reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derivation-verification
          path: |
            work/verify-*.json
            work/derived-models.sha256

      - name: Create release with derived artifacts
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "Derived model artifacts ${{ inputs.release_tag }}" \
            --notes "Deterministic derivations of the stable catalog models (issue #22): initializer-deduplicated htdemucs_ft and dual-output (four-stem + karaoke projection) models — one file serves both application modes. Verified numerically against their sources in this workflow run (run_id ${{ github.run_id }}). See derived-models.sha256 for digests." \
            work/htdemucs_ft.dedup.fp32.onnx \
            work/htdemucs.dual.fp32.onnx \
            work/htdemucs_ft.dual.fp32.onnx \
            work/derived-models.sha256 \
            work/verify-ft-dedup.json work/verify-h-dual.json work/verify-ft-dual.json
