name: Publish v2 catalog

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Catalog release ID (YYYY-MM-DD-NNN)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official:
    uses: ./.github/workflows/official-runtime-smoke.yml
  differential:
    uses: ./.github/workflows/quality-gates.yml
  contract:
    uses: ./.github/workflows/runtime-contract.yml
  publish:
    needs: [official, differential, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.20'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ort-nuget-runtimes
          path: nuget
      - name: Collect smoke-tested runtimes, plugins, and the carried-forward Intel runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir packages intel
          cp nuget/packages/onnxruntime-*-openkara-* packages/
          python -c 'import sys,urllib.request; from pathlib import Path; sys.path.insert(0,"scripts"); from generate_catalog_v2 import PLUGINS; [(urllib.request.urlretrieve(u, Path("packages") / u.rsplit("/",1)[-1])) for u,_,_ in PLUGINS.values()]'
          url=$(python -c 'import sys; sys.path.insert(0, "scripts"); import generate_catalog_v2 as g; print(g.intel_download_url())')
          case "$url" in https://github.com/thedavidweng/openkara-models/releases/download/*) ;; *) echo "unexpected Intel runtime URL: $url"; exit 1;; esac
          tag=$(printf '%s' "$url" | cut -d/ -f8)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir intel --pattern "${url##*/}"
      - name: Generate manifest
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$ ]]
          archive=$(find intel -name '*x86_64-apple-darwin.tar.gz' -print -quit)
          test -n "$archive"
          python scripts/generate_catalog_v2.py --packages packages --intel "$archive" --release-id "$RELEASE_ID" --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --producer-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output "catalog/releases/$RELEASE_ID.json"
      - name: Create draft and verify publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          gh release create "infra-$RELEASE_ID" --target "$GITHUB_SHA" --title "Infrastructure release $RELEASE_ID" --notes "Catalog release $RELEASE_ID. ONNX Runtime archives repackaged from the Microsoft-signed Microsoft.ML.OnnxRuntime NuGet package." --draft packages/onnxruntime-*-openkara-*
          cp "catalog/releases/$RELEASE_ID.json" release-manifest.json
          gh release upload "infra-$RELEASE_ID" "catalog/releases/$RELEASE_ID.json" release-manifest.json
          python scripts/publish_catalog_release.py --release "$RELEASE_ID" --channel stable-v2 --execute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-v2-pointer
          path: |
            catalog/releases/${{ inputs.release_id }}.json
            catalog/channels/stable-v2.json
          if-no-files-found: error
          retention-days: 30
