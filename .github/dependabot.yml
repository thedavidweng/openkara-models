version: 2
updates:
  # Python dependencies — owned by Dependabot.
  # Renovate and repository-owned scripts do NOT touch requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      torch:
        patterns: ["torch", "torchaudio"]
      onnx:
        patterns: ["onnx", "onnxruntime"]

  # GitHub Actions — owned by Dependabot.
  # Renovate and repository-owned scripts do NOT touch workflow files.
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
