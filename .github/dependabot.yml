version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Floors in requirements.txt are proven minimums, not targets. convert.yml
    # also installs this file on Python 3.11, where NumPy 2.5+ does not exist,
    # so raising a floor that already admits the new release breaks the
    # converter (#152). Only widen a range when a release falls outside it.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      torch:
        patterns: ["torch", "torchaudio"]
      onnx:
        patterns: ["onnx", "onnxruntime"]

    # GitHub Actions — owned by Dependabot.
    # Renovate and repository-owned scripts do NOT touch workflow files.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
